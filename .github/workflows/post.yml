name: Kanalga post

# Kundalik postlarni endi doim yoniq bot (bot.yml) chiqaradi.
# Bu yerdan faqat qo'lda sinov qilinadi.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test = faqat menga yuborish, now = darhol kanalga, chat_id = ADMIN_CHAT_ID ni topish"
        type: choice
        default: test
        options: [test, now, chat_id, models, probe]

concurrency:
  group: kanal-sinov
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ffmpeg (video uchun)
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Post tayyorlash va chiqarish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_API }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVEN_LABS_API }}
          ELEVENLABS_VOICE_ID: ${{ secrets.VOCIE_ID }}
        run: python -m mehrbot.main --mode "${{ inputs.mode || 'scheduled' }}"
      - name: Ma'lumotlarni saqlash
        if: success()
        run: scripts/save_data.sh
