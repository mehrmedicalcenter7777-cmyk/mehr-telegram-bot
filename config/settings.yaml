# Mehr Medical Center: Telegram kanal sozlamalari

# Rubrika: har bir post shu mavzu doirasida bo'ladi
rubric: >
  Tibbiyot bo'yicha foydali faktlar va maslahatlar: kasallik belgilari,
  oldini olish, qachon va qaysi mutaxassisga murojaat qilish kerakligi,
  hamda Mehr Medical Center shifokorlarini tavsiya qilish.

channel_id: "@mehr_medical7"
channel_name: "MEHR MEDICAL"
clinic_name: "Mehr Medical Center"
clinic_phone: "+998 91 000 03 03"
clinic_address: ""      # masalan: "Toshkent sh., ... ko'chasi, 12"

timezone: "Asia/Tashkent"
post_times: ["08:00", "12:00"]
preview_minutes_before: 10

language: "o'zbek tili, lotin yozuvi"

# Gemini to'lovsiz (bepul) kalitda internet qidiruvi va AI rasm ishlamaydi.
# Bunday holda dastur o'zi qidiruvsiz yozadi va rasm o'rniga klinika kartasini chizadi.
web_search: true
image_mode: "ai"        # "ai" = Nano Banana rasmi, "card" = doim klinika kartasi

models:
  # Birinchisi ishlamasa (limit, yopilgan model), keyingisi ishlatiladi
  text: ["gemini-3.8-flash", "gemini-3.5-flash-lite", "gemini-3.1-flash-lite"]
  image: "gemini-3.1-flash-image"   # "Nano Banana 2"
  image_aspect_ratio: "4:5"

elevenlabs:
  model_id: "eleven_v3"
  output_format: "mp3_44100_128"

# Bir mavzu takrorlanmasligi uchun nechta oldingi post eslab qolinadi
history_size: 120
